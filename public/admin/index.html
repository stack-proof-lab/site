<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- CSP from Sveltia's security page generator (https://sveltiacms.app/en/docs/security) with the
         GitHub service selected, read 19 Nov 2026, plus default-src, object-src, base-uri and
         form-action. A server header is preferred where the host allows it; the meta tag is the
         documented alternative. frame-ancestors cannot be set by a meta tag. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://*.githubusercontent.com; media-src blob:; frame-src blob:; script-src 'self'; connect-src 'self' blob: data: https://api.github.com https://www.githubstatus.com; manifest-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Stack proof: content editor</title>
  </head>
  <body>
    <!-- Served from this site at the version pinned in package.json; copied in by scripts/copy-cms.mjs. -->
    <script src="./sveltia-cms.js"></script>
  </body>
</html>
